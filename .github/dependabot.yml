# Dependabot keeps the three dependency surfaces current. Nothing here ships to
# users at runtime (the plugin has no runtime Composer or npm dependencies);
# the point is the build toolchain that produces the shipped block and the
# workflows that publish releases. Updates arrive monthly, grouped, so a quiet
# month is one PR per ecosystem at most.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      wordpress-scripts:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      php-dev-tools:
        patterns: ['*']
    ignore:
      # PHPUnit 11+ needs PHP 8.2+, 12+ needs 8.3+, 13+ needs 8.4+. The plugin's
      # floor is PHP 8.1 and CI installs dev dependencies there, so a PHPUnit
      # major bump is a hand change tied to raising the floor, not a Dependabot
      # PR. Minor and patch updates still arrive.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
