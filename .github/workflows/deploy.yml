name: Deploy to WordPress.org

# Builds the plugin exactly as CI does and commits it to the WordPress.org SVN
# repository: trunk/, tags/<version>/ and the directory assets.
#
# Two ways to run it:
#   Push a release tag (v1.1.0)
#       Deploys that tag and commits it to SVN (DRY_RUN below is off since the
#       1.0.0 release; set it to 'true' to rehearse a tag push without committing).
#   Run workflow (workflow_dispatch)
#       Pick the release tag to deploy and whether it is a dry run. Use this
#       to rehearse a release, or to redeploy a tag by hand (1.0.0 was deployed
#       this way on 2026-11-05 because the tag predated the SVN repository).
#
# Gate: repository variable WPORG_SVN_READY = true (set on 2026-11-04, after
# approval). While unset the SVN step is skipped and only the build and
# version check run.
#
# Secrets (repository settings → Secrets → Actions), required by the deploy
# action even for a dry run:
#   SVN_USERNAME  WordPress.org username (lxdintegral)
#   SVN_PASSWORD  the SVN password generated in the WordPress.org profile
#                 (not the account password)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (for example v1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: check out SVN and stage everything, commit nothing'
        required: true
        type: boolean
        default: true

env:
  SLUG: lxd-integral-microcredentials-for-learndash
  # Applies to tag pushes only; a manual run takes the dry_run input.
  DRY_RUN: 'false'

jobs:
  deploy:
    name: Build and deploy ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the release tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a release tag (expected v<version>)"; exit 1 ;;
          esac
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            dry_run='${{ inputs.dry_run }}'
          else
            dry_run="$DRY_RUN"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "DRY_RUN=$dry_run" >> "$GITHUB_ENV"
          echo "tag=$tag version=${tag#v} dry_run=$dry_run"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the block
        run: |
          npm ci
          npm run build

      # Same allow-list as CI, so the deployed tree is the tested tree.
      - name: Stage the plugin
        run: |
          set -euo pipefail
          mkdir -p "dist/$SLUG"
          cp lxd-integral-microcredentials-for-learndash.php uninstall.php readme.txt changelog.txt README.md LICENSE "dist/$SLUG/"
          cp -R src build blocks languages docs "dist/$SLUG/"
          test -f "dist/$SLUG/build/earned-badges/block.json"

      - name: The tag must match the plugin version
        run: |
          set -euo pipefail
          header=$(sed -n 's/^ \* Version: *//p' "dist/$SLUG/$SLUG.php")
          stable=$(sed -n 's/^Stable tag: *//p' "dist/$SLUG/readme.txt")
          echo "tag=$VERSION header=$header stable=$stable"
          test "$VERSION" = "$header" && test "$VERSION" = "$stable"

      - name: SVN not ready yet
        if: vars.WPORG_SVN_READY != 'true'
        run: echo "::notice::WPORG_SVN_READY is not set; built and verified, SVN step skipped."

      - name: Deploy to WordPress.org SVN
        if: vars.WPORG_SVN_READY == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ env.DRY_RUN == 'true' }}
          generate-zip: true
        env:
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: dist/${{ env.SLUG }}
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
